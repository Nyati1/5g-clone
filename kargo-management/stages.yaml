apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: 5g-network-simulation
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: 5g-sim-warehouse
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/Nyati1/5g-clone.git
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./src
      - uses: git-commit
        as: commit
        config:
          path: ./src
          message: Promote dev config change
      - uses: git-push
        config:
          path: ./src
          targetBranch: main
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: 5g-network-simulation
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: 5g-sim-warehouse
    sources:
      stages: [dev]
  promotionTemplate:
  spec:
    vars:
    - name: gitRepo
      value: https://github.com/Nyati1/5g-clone.git

    steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
        - branch: main
          path: ./src
        - branch: env/staging
          create: true
          path: ./out

    - uses: git-clear
      config:
        path: ./out

    - uses: kustomize-build
      config:
        path: ./src/env/staging
        outPath: ./out/manifests.yaml

    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: "Render staging manifests"

    - uses: git-push
      config:
        path: ./out
        targetBranch: env/staging

    - uses: argocd-update
      config:
        apps:
        - name: core-1-staging
          sources:
          - repoURL: ${{ vars.gitRepo }}
            desiredRevision: ${{ outputs.commit.commit }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: 5g-network-simulation
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: 5g-sim-warehouse
    sources:
      stages: [staging]
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/Nyati1/5g-clone.git
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: env/staging
            path: ./staging

          - branch: env/prod
            path: ./prod
      - uses: copy
        config:
          inPath: ./staging/env/staging/kustomization.yaml
          outPath: ./prod/env/prod/kustomization.yaml
      - uses: git-commit
        as: commit
        config:
          path: ./prod
          message: Promote staging config to prod
      - uses: git-push
        config:
          path: ./prod
          targetBranch: env/prod

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 5g-simulation-deployments
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            project: default
            branch: env/dev
          - env: staging
            project: default
            branch: env/staging
          - env: prod
            project: default
            branch: env/prod
  template:
    metadata:
      name: 'core-1-{{env}}'
    spec:
      project: '{{project}}'
      source:
        repoURL: https://github.com/Nyati1/5g-clone.git
        targetRevision: '{{branch}}'
        path: '.'
      destination:
        name: in-cluster
        namespace: '5g-core-1-{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
